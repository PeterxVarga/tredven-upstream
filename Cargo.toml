[package]
name = "tredven-upstream"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local, source-bound upgrade preflight for self-hosted software"
license = "MIT"
repository = "https://github.com/PeterxVarga/tredven-upstream"
readme = "README.md"
keywords = ["self-hosted", "upgrade", "preflight", "compatibility", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
